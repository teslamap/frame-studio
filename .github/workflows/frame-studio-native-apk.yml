name: FRAME STUDIO Native APK
on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/frame-studio-native-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        id: compile
        shell: bash
        run: |
          set -o pipefail
          gradle -p native :app:assembleDebug --no-daemon 2>&1 | tee native-build.log
      - name: Upload installable APK
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FRAME-STUDIO-Native-APK
          path: native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Record build diagnostics for maintainers
        if: always()
        shell: bash
        run: |
          LOG_FILE="$(mktemp)"
          {
            echo "Commit: $GITHUB_SHA"
            echo "Compile step: ${{ steps.compile.outcome }}"
            if [ -f native-build.log ]; then
              grep -E -i '(^e: |error:|unresolved reference|failed|what went wrong|could not|BUILD SUCCESSFUL|BUILD FAILED|exception)' native-build.log | tail -n 110 || true
              echo "--- Last 35 lines ---"
              tail -n 35 native-build.log
            else
              echo "Build command not reached: inspect setup steps in Actions."
            fi
          } > "$LOG_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          mkdir -p ci/native-builds
          cp "$LOG_FILE" "ci/native-builds/$GITHUB_SHA.txt"
          git add ci/native-builds
          git commit -m "CI: record native APK build diagnostics for $GITHUB_SHA" || true
          git push origin main || true
