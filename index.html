<!doctype html><html lang="ka"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FRAME STUDIO Offline</title><style>:root{font:14px system-ui;color:#e8efff;background:#0b1020}*{box-sizing:border-box}body{margin:0;padding:20px}header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}h1{margin:0;font-size:25px}h1 span{color:#6aa7ff}small{color:#9eafce}main{display:grid;grid-template-columns:300px minmax(320px,1fr)260px;gap:15px}section,aside{background:#151e33;border:1px solid #2c3c5a;border-radius:16px;padding:16px}label{display:block;margin:9px 0;color:#acbdd9;font-size:12px}input,select,textarea{width:100%;padding:10px;border:1px solid #354561;background:#0c1527;color:white;border-radius:9px;font:inherit}textarea{height:80px}button{background:#233452;border:1px solid #405477;color:white;padding:10px;border-radius:9px;cursor:pointer}button:hover,.primary{background:#377cf3}.bar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.drawing{background:#f1f5fa;border-radius:12px;padding:10px}svg{width:100%;height:470px;touch-action:none}.selected{background:#377cf3}.entry{display:flex;gap:5px;margin:7px 0}.entry button:first-child{flex:1;text-align:left}.muted{font-size:12px;color:#9eafce}#print{display:none}@media(max-width:1050px){main{grid-template-columns:1fr 1fr}aside{grid-column:1/-1}}@media(max-width:680px){main{grid-template-columns:1fr}aside{grid-column:auto}}@page{size:A4;margin:12mm}@media print{body{background:white;color:black;padding:0}header,main{display:none!important}#print{display:block;font:12px Arial}#print svg{height:145mm}#print .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}#print .grid div{border-bottom:1px solid #ddd;padding:6px}}</style><header><div><h1>FRAME <span>STUDIO</span> <small>OFFLINE</small></h1><small>კარ-ფანჯრის შეკვეთების კონსტრუქტორი</small></div><div class="bar"><button id="new">＋ ახალი</button><button id="save" class="primary">შენახვა</button><button id="backup">JSON ექსპორტი</button><button id="import">იმპორტი</button><input hidden type="file" id="file" accept=".json"><button id="pdf" class="primary">PDF / ბეჭდვა</button></div></header><main><section><h3>შეკვეთის დეტალები</h3><div id="form"></div></section><section><h3>ვიზუალური კონსტრუქტორი</h3><div class="bar"><button data-mode="select" class="selected">არჩევა</button><button data-mode="v">┃ ვერტ. იმპოსტი</button><button data-mode="h">━ ჰორ. იმპოსტი</button><button id="undo">↶ უკან</button><button id="clear">გასუფთავება</button></div><div class="drawing"><svg id="svg" viewBox="0 0 800 600"></svg></div><p class="muted">აირჩიე იმპოსტის მიმართულება და დააჭირე უჯრას. არჩევის რეჟიმში დააჭირე უჯრას გაღების შესაცვლელად.</p><div id="status" class="muted"></div></section><aside><h3>არჩეული უჯრა</h3><div id="cell"></div><hr><h3>შენახული შეკვეთები</h3><p class="muted">ინახება ამ ბრაუზერში. სარეზერვოდ გამოიყენე JSON ექსპორტი.</p><div id="saved"></div></aside></main><div id="print"></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),key='frame_studio_v1',defs=[['orderNo','შეკვეთის №'],['date','თარიღი','date'],['customer','დამკვეთი'],['phone','ტელეფონი'],['address','მისამართი'],['quantity','რაოდენობა','number'],['width','სიგანე (მმ)','number'],['height','სიმაღლე (მმ)','number'],['kind','კონსტრუქციის ტიპი'],['profile','პროფილი'],['color','ფერი'],['glass','მინაპაკეტი'],['hardware','ფურნიტურა'],['notes','შენიშვნები']];$('form').innerHTML=defs.map(([id,label,type])=>'<label>'+label+(id==='notes'?'<textarea id="'+id+'"></textarea>':'<input id="'+id+'" type="'+(type||'text')+'">')+'</label>').join('');let cells=[],selected=null,mode='select',history=[],current=null;const uid=()=>Math.random().toString(36).slice(2,11),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=id=>Math.max(200,+$(id).value||200),openings={fixed:'ფიქსირებული',left:'მარცხენა',right:'მარჯვენა',tilt:'გადმოსაწევი',tiltleft:'მარცხენა + გადმოსაწევი',tiltright:'მარჯვენა + გადმოსაწევი'};function initial(){return[{id:uid(),x:0,y:0,w:1,h:1,opening:'fixed'}]}function snap(){history.push(JSON.stringify(cells));if(history.length>50)history.shift()}function bounds(){let w=num('width'),h=num('height'),s=Math.min(620/w,420/h);return{x:90+(620-w*s)/2,y:85+(420-h*s)/2,w:w*s,h:h*s}}function draw(print=false){let b=bounds(),W=num('width'),H=num('height');let s='<rect width="800" height="600" fill="#f1f5fa"/><g stroke="#718096" stroke-width="1"><path d="M'+b.x+' '+(b.y-25)+' H'+(b.x+b.w)+' M'+(b.x-26)+' '+b.y+' V'+(b.y+b.h)+'"/></g><g fill="#213852" font-size="19" font-family="Arial"><text x="'+(b.x+b.w/2)+'" y="'+(b.y-35)+'" text-anchor="middle">'+W+' მმ</text><text x="'+(b.x-38)+'" y="'+(b.y+b.h/2)+'" transform="rotate(-90 '+(b.x-38)+' '+(b.y+b.h/2)+')" text-anchor="middle">'+H+' მმ</text></g>';for(const c of cells){let x=b.x+c.x*b.w,y=b.y+c.y*b.h,w=c.w*b.w,h=c.h*b.h,cx=x+w/2,cy=y+h/2;s+='<g data-id="'+esc(c.id)+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" stroke="#263e5a" stroke-width="8" fill="'+(!print&&selected===c.id?'#cde6ff':'#e5f5ff')+'"/><rect x="'+(x+9)+'" y="'+(y+9)+'" width="'+Math.max(0,w-18)+'" height="'+Math.max(0,h-18)+'" fill="none" stroke="#94adc7"/>';let L=x+15,R=x+w-15,T=y+15,B=y+h-15;if(c.opening!=='fixed'){s+='<g fill="none" stroke="#3176a6" stroke-width="2.5" stroke-dasharray="6 4">';if(c.opening.includes('left'))s+='<path d="M'+L+' '+T+' L'+R+' '+cy+' L'+L+' '+B+'"/>';if(c.opening.includes('right'))s+='<path d="M'+R+' '+T+' L'+L+' '+cy+' L'+R+' '+B+'"/>';if(c.opening.includes('tilt'))s+='<path d="M'+L+' '+T+' L'+cx+' '+B+' L'+R+' '+T+'"/>';s+='</g>'}if(w>80&&h>55)s+='<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" fill="#294c6a" font-size="15">'+Math.round(c.w*W)+' × '+Math.round(c.h*H)+'</text>';s+='</g>'}return s}function render(){ $('svg').innerHTML=draw();$('status').textContent=cells.length+' უჯრა · '+num('width')+' × '+num('height')+' მმ';let c=cells.find(x=>x.id===selected);$('cell').innerHTML=c?'<p>'+Math.round(c.w*num('width'))+' × '+Math.round(c.h*num('height'))+' მმ</p><label>გაღება<select id="opening">'+Object.entries(openings).map(([k,v])=>'<option value="'+k+'" '+(c.opening===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label><div class="bar"><button id="sv">┃ გაყოფა</button><button id="sh">━ გაყოფა</button></div>':'<p class="muted">აირჩიე უჯრა ნახაზზე.</p>';if(c){$('opening').onchange=e=>{snap();c.opening=e.target.value;render()};$('sv').onclick=()=>split(c.id,'v',.5);$('sh').onclick=()=>split(c.id,'h',.5)}}function split(id,axis,f){let i=cells.findIndex(x=>x.id===id);if(i<0||cells.length>=80)return;let c=cells[i];if((axis==='v'?c.w*num('width'):c.h*num('height'))<160)return alert('უჯრა ძალიან პატარაა');snap();f=Math.max(.15,Math.min(.85,f));let a={...c,id:uid(),opening:'fixed'},b={...c,id:uid(),opening:'fixed'};if(axis==='v'){a.w=c.w*f;b.x=c.x+a.w;b.w=c.w-a.w}else{a.h=c.h*f;b.y=c.y+a.h;b.h=c.h-a.h}cells.splice(i,1,a,b);selected=a.id;render()}$('svg').onclick=e=>{let g=e.target.closest('[data-id]');if(!g)return;let id=g.dataset.id,c=cells.find(x=>x.id===id);if(mode==='select'){selected=id;render();return}let p=$('svg').createSVGPoint();p.x=e.clientX;p.y=e.clientY;p=p.matrixTransform($('svg').getScreenCTM().inverse());let b=bounds(),f=mode==='v'?(p.x-b.x-c.x*b.w)/(c.w*b.w):(p.y-b.y-c.y*b.h)/(c.h*b.h);split(id,mode,f)};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('selected',x===b))});$('undo').onclick=()=>{if(history.length){cells=JSON.parse(history.pop());selected=null;render()}};$('clear').onclick=()=>{if(confirm('გავასუფთავოთ?')){snap();cells=initial();selected=cells[0].id;render()}};['width','height'].forEach(id=>$(id).oninput=render);function all(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}}function store(a){localStorage.setItem(key,JSON.stringify(a))}function collect(){return{id:current||uid(),fields:Object.fromEntries(defs.map(([id])=>[id,$(id).value])),cells:JSON.parse(JSON.stringify(cells)),updated:new Date().toISOString()}}function list(){let a=all();$('saved').innerHTML=a.length?a.map(o=>'<div class="entry"><button data-load="'+esc(o.id)+'">'+esc(o.fields.orderNo||'№')+' · '+esc(o.fields.customer||'უსახელო')+'</button><button data-del="'+esc(o.id)+'">✕</button></div>').join(''):'<p class="muted">შეკვეთები ჯერ არ არის</p>';document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{let o=all().find(x=>x.id===b.dataset.load);if(!o)return;defs.forEach(([id])=>$(id).value=o.fields[id]??'');cells=o.cells;current=o.id;selected=null;history=[];render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('წავშალოთ?')){store(all().filter(x=>x.id!==b.dataset.del));list()}})}$('save').onclick=()=>{try{let o=collect(),a=all(),i=a.findIndex(x=>x.id===o.id);if(i<0)a.unshift(o);else a[i]=o;store(a);current=o.id;list();alert('შენახულია')}catch(e){alert('შენახვის შეცდომა: '+e.message)}};function reset(){defs.forEach(([id])=>$(id).value='');$('width').value=1800;$('height').value=1500;$('quantity').value=1;$('kind').value='ფანჯარა';$('date').value=new Date().toISOString().slice(0,10);$('orderNo').value='ORD-'+Date.now().toString().slice(-8);cells=initial();selected=cells[0].id;current=null;history=[];render()}$('new').onclick=()=>{if(confirm('ახალი შეკვეთა?'))reset()};$('backup').onclick=()=>{let blob=new Blob([JSON.stringify({format:'frame-studio-v1',orders:all(),current:collect()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='frame-studio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let o=JSON.parse(await e.target.files[0].text()),a=all();for(const item of o.orders||[]){if(!item.id||!item.fields||!Array.isArray(item.cells))continue;let i=a.findIndex(x=>x.id===item.id);if(i<0)a.push(item);else a[i]=item}store(a);list();alert('იმპორტი დასრულდა')}catch(err){alert(err.message)}e.target.value=''};$('pdf').onclick=()=>{let o=collect();$('print').innerHTML='<h1>FRAME STUDIO — შეკვეთის ფურცელი</h1><div class="grid">'+defs.map(([id,label])=>'<div><small>'+label+'</small><br><b>'+esc(o.fields[id])+'</b></div>').join('')+'</div><svg viewBox="0 0 800 600">'+draw(true)+'</svg><p>დამკვეთის ხელმოწერა: ___________________　 შემსრულებლის ხელმოწერა: ___________________</p>';window.print()};reset();list()})();</script></html>
